name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Conectar na tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy na VM
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.SSH_HOST }} <<'EOF'
            set -euo pipefail
            cd ~/orchidiary
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
          EOF
